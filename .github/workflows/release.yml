name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# CI 构建产物和 Release 共用一个权限
permissions:
  contents: write

jobs:
  # ─── CI: 每次推送都运行测试和构建 ───
  ci:
    name: CI — Test & Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
            dist/
            dist-electron/
          retention-days: 3

  # ─── Release: 仅当打 tag 时才打包和发布 ───
  release:
    name: Release — Package & Upload
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Package portable executable
        run: npm run package:portable

      - name: Package portable with 7-Zip (alternative format)
        run: |
          7z a FlowDesk-${{ github.ref_name }}-portable-x64.7z ./release/*.exe
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FlowDesk ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.exe
            release/*.exe.zip
            FlowDesk-*.7z
